version: '3.8'

services:
  immich-book:
    build:
      context: .
      args:
        - VITE_IMMICH_PROXY_TARGET=${IMMICH_SERVER_URL:?Set IMMICH_SERVER_URL in .env}
    container_name: immich-book-frontend
    restart: unless-stopped
    environment:
      - IMMICH_API_KEY=${IMMICH_API_KEY:?Set IMMICH_API_KEY in .env}
    depends_on:
      - immich-book-backend
    networks:
      - proxy

  immich-book-backend:
    build:
      context: ./backend
    container_name: immich-book-backend
    restart: unless-stopped
    volumes:
      - immich-book-data:/data
    networks:
      - proxy

networks:
  # Must already exist and be reachable by whatever sits in front of this
  # stack (reverse proxy, Immich server) - see INTEGRATION.md. Point
  # EXTERNAL_NETWORK at that network's real name; it isn't created here.
  proxy:
    external: true
    name: ${EXTERNAL_NETWORK:-immich-book_proxy}

volumes:
  immich-book-data:
